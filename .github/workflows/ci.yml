name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported engines range (package.json: >=20.18 <25).
        # 20 is the CI baseline that has historically caught crashes newer local
        # Node versions hid; 22 is the current LTS most contributors run.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check migration round trip
        run: npm run test:migrations

      # COVERAGE makes the server suite collect coverage inside this run rather
      # than running the whole suite a second time. Only the Node 22 leg sets
      # it, so the Node 20 leg keeps uninstrumented timings. Reporting only,
      # there are no thresholds and coverage never fails the build.
      - name: Run tests
        env:
          COVERAGE: ${{ matrix.node-version == '22' && '1' || '' }}
        run: npm test

      # server + cli only; the client has its own backlog of ESLint violations
      # and is brought in under a separate change.
      - name: Lint
        run: npm run lint

      - name: Build workspaces
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # Production dependencies only, and only high and above. Two deliberate
      # narrowings:
      #
      #   --omit=dev, because a vulnerability in a test runner is not reachable
      #   by a request and failing the build on one trains people to ignore the
      #   job.
      #
      #   --audit-level=high, for the same reason: this gate has to stay
      #   credible enough that a red run means "stop and look".
      #
      # Runs as its own job rather than a step in the matrix so an advisory
      # published overnight does not mask a real test failure, and so it is
      # reported once instead of twice.
      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
